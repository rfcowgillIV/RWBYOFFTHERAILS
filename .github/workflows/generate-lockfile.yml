# TEMPORARY: creates Gemfile.lock once on GitHub's servers and commits it to this branch.
# Removed again in the next commit.
name: Generate lockfile
on:
  push:
    branches: [ "security-updates-2026" ]
permissions:
  contents: write
jobs:
  lock:
    if: hashFiles('Gemfile.lock') == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
      - run: bundle lock --add-platform x86_64-linux arm64-darwin x86_64-darwin aarch64-linux
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gemfile.lock
          git commit -m "Add generated Gemfile.lock"
          git push
